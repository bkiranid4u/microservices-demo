# =============================================================================
# Kubernetes logging + observability environment variables for microservices-demo
#
# Merge the ConfigMap into your Deployment pod template:
#   envFrom:
#     - configMapRef:
#         name: microservices-logging
#
# Choose one OTel collector endpoint below (Grafana Alloy, Dynatrace, or Splunk).
# =============================================================================

# ─── Shared ConfigMap ────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-logging
  namespace: microservices-demo
data:
  # Spring profiles — activates JSON logging (non-local profile = JSON in logback-base.xml)
  SPRING_PROFILES_ACTIVE: "kubernetes"
  DEPLOYMENT_ENVIRONMENT: "production"

  # Logging defaults (override per Deployment if needed)
  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_FILE_PATH: "/var/log/app"

  # ─── OTel Identity ─────────────────────────────────────────────────────────
  # Set OTEL_SERVICE_NAME per Deployment, not in this shared ConfigMap.
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,service.namespace=microservices-demo"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"   # 10% sampling in production; 1.0 in staging

  # ─── Option A: Grafana Alloy / self-hosted OTel Collector ──────────────────
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-alloy.observability.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"

  # ─── Option B: Dynatrace (OTLP native ingest) ──────────────────────────────
  # Requires a Secret "dynatrace-otel" with key DT_API_TOKEN.
  # See: https://docs.dynatrace.com/docs/extend-dynatrace/opentelemetry
  # OTEL_EXPORTER_OTLP_ENDPOINT: "https://<env-id>.live.dynatrace.com/api/v2/otlp"
  # OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  # (Mount DT_API_TOKEN from Secret and set header via OTEL_EXPORTER_OTLP_HEADERS)

  # ─── Option C: Splunk Observability Cloud (OTLP ingest) ────────────────────
  # Requires a Secret "splunk-otel" with key SPLUNK_ACCESS_TOKEN.
  # See: https://docs.splunk.com/observability/en/gdi/opentelemetry/opentelemetry.html
  # OTEL_EXPORTER_OTLP_ENDPOINT: "https://ingest.<realm>.signalfx.com:443"
  # OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  # (Mount SPLUNK_ACCESS_TOKEN from Secret)

---
# ─── OTel Java Agent ConfigMap (attach to Deployments as init container) ────
# The OTel Java agent auto-instruments the JVM — no code changes needed.
# Dynatrace OneAgent, Splunk OTel Java agent, or the upstream opentelemetry-javaagent.jar
# all expose the same OTEL_* env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-java-agent
  namespace: microservices-demo
data:
  # Path where the agent JAR is mounted (via init container or emptyDir volume)
  JAVA_TOOL_OPTIONS: >-
    -javaagent:/otel/opentelemetry-javaagent.jar
    -Dotel.javaagent.enabled=true

---
