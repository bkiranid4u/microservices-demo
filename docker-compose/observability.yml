# =============================================================================
# Observability Stack — add to any docker compose run for local telemetry:
#
#   docker compose -f docker-compose.yaml -f docker-compose/observability.yml up
#
# Services:
#   otel-collector — receives OTLP from services, fans out to Loki/Tempo/Prometheus
#   loki           — log aggregation (Grafana-native)
#   tempo          — distributed tracing backend
#   grafana        — dashboards (open http://localhost:3000, admin/admin)
#
# Services in docker-compose.yaml already send OTEL_EXPORTER_OTLP_ENDPOINT to
# the otel-collector. Just add this overlay and all traces, logs, and metrics
# flow into Grafana automatically.
#
# Production backends (Dynatrace / Splunk):
#   Edit docker-compose/otel-collector-config.yaml and uncomment the relevant
#   exporter + pipeline blocks.  Set the required env vars in your shell or CI:
#     DYNATRACE_ENDPOINT, DYNATRACE_API_TOKEN
#     SPLUNK_HEC_ENDPOINT, SPLUNK_HEC_TOKEN
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # OpenTelemetry Collector
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker-compose/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC — services connect here
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # Collector self-metrics (Prometheus)
      - "8889:8889"    # Prometheus metrics exporter
    depends_on:
      - loki
      - tempo
    networks:
      - kafka-net

  # ---------------------------------------------------------------------------
  # Grafana Loki — log aggregation
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.1.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"
    networks:
      - kafka-net

  # ---------------------------------------------------------------------------
  # Grafana Tempo — distributed tracing
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker-compose/tempo-config.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo query API
      - "4327:4317"   # OTLP gRPC (avoids port clash with collector)
    networks:
      - kafka-net

  # ---------------------------------------------------------------------------
  # Grafana — dashboards (user: admin / pass: admin)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker-compose/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    depends_on:
      - loki
      - tempo
      - otel-collector
    networks:
      - kafka-net

networks:
  kafka-net:
    external: true
