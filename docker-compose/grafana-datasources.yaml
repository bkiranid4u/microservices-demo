# Grafana provisioning — auto-configures Loki and Tempo data sources on startup.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: "Trace ID"
          matcherRegex: '"traceId"\s*:\s*"([a-f0-9]{32})"'
          url: "$${__value.raw}"
          datasourceUid: tempo
        - name: "Trace ID (OTel)"
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]{32})"'
          url: "$${__value.raw}"
          datasourceUid: tempo

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://otel-collector:8889
